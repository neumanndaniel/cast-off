apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: kind
networking:
  podSubnet: "100.64.0.0/10"
  serviceSubnet: "192.168.0.0/16"
  disableDefaultCNI: true
  kubeProxyMode: "none"
nodes:
  - role: control-plane
    image: kindest/node:v1.36.1
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "topology.kubernetes.io/zone=1"
  - role: control-plane
    image: kindest/node:v1.36.1
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "topology.kubernetes.io/zone=2"
  - role: worker
    image: kindest/node:v1.36.1
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "topology.kubernetes.io/zone=1"
  - role: worker
    image: kindest/node:v1.36.1
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "topology.kubernetes.io/zone=2"
